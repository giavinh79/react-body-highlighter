# pnpm 11+ already defaults to strictDepBuilds, blockExoticSubdeps and a 1-day minimumReleaseAge.
# Newly published versions are not resolved for 2 days.
minimumReleaseAge: 2880
# rslib 1.0.0 and its dts plugin (published 2026-09-03T07:20Z) were hours short of the gate when adopted; safe to remove any time after 2026-09-05.
minimumReleaseAgeExclude:
  - '@rslib/core'
  - rsbuild-plugin-dts
# Fail if a dependency's trust evidence weakens (trusted publisher -> provenance -> none).
trustPolicy: no-downgrade
# semver 5 and 6 predate npm provenance; newer majors have it, which the policy reads as a downgrade.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
# No dependency may run install scripts. lefthook hooks are installed by the prepare script instead;
# esbuild's postinstall only re-checks the platform binary its optional dependency already provides.
allowBuilds:
  lefthook: false
  esbuild: false
